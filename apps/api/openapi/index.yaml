openapi: 3.0.3
info:
  title: NR Lagos API
  version: 1.0.0
  description: |
    OTP login flow:
    1. `POST /auth/otp/request` with a phone number to request an OTP.
    2. `POST /auth/otp/verify` with phone and code to receive bearer tokens.
    3. The API also sets httpOnly auth cookies (`nr_access_token` and `nr_refresh_token`).
    4. Protected routes accept either `Authorization: Bearer <token>` or the `nr_access_token` cookie.

    Public routes:
    - `/health`
    - `/auth/otp/request`
    - `/auth/otp/verify`

    All other API routes are protected.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: nr_access_token

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: Health
    description: Public system health endpoint
  - name: Auth
    description: OTP login endpoints and authenticated profile update
  - name: Locations
    description: Public reference data — Lagos places with full names and aliases for ride search autocomplete
  - name: Rides
    description: Protected ride discovery, booking, and management endpoints

paths:
  /health:
    $ref: "./paths/health.yaml"

  /locations:
    $ref: "./paths/locations.yaml#/listLocations"

  /auth/otp/request:
    $ref: "./paths/auth.yaml#/otpRequest"

  /auth/otp/verify:
    $ref: "./paths/auth.yaml#/otpVerify"

  /me:
    get:
      $ref: "./paths/auth.yaml#/getMe/get"
    post:
      $ref: "./paths/auth.yaml#/updateMe/post"

  /rides/search:
    $ref: "./paths/rides.yaml#/searchRides"

  /rides/today:
    $ref: "./paths/rides.yaml#/todayRide"

  /rides/{rideId}/respond:
    $ref: "./paths/rides.yaml#/respondToRide"

  /rides/{rideId}/join:
    $ref: "./paths/rides.yaml#/joinRide"

  /rides:
    $ref: "./paths/rides.yaml#/createRide"

  /me/rides/rider:
    $ref: "./paths/rides.yaml#/myRiderRides"

  /me/rides/driver:
    $ref: "./paths/rides.yaml#/myDriverRides"

  /rides/{rideId}:
    $ref: "./paths/rides.yaml#/cancelRide"

  /me/rides/rider/{bookingId}:
    $ref: "./paths/rides.yaml#/cancelBooking"
